name: Compile Kivy Android App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget swig libltdl-dev \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libffi-dev libssl-dev build-essential

      - name: Upgrade Pip and Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.33 buildozer

      - name: Force Install Legacy Android SDK Tools for Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          cp -r temp_tools/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/tools/
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          cp -r temp_tools/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools

      - name: Inject Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24330f8a85c6e5e3e20d7407d57279326d9c727a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d556f162b70fa75cbd7971519d5cf27c02b6abf8" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build with Buildozer
        run: |
          buildozer -v android release

      - name: Upload Compiled AAB
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.aab
