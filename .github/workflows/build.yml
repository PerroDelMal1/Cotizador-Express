name: Compile Kivy Android App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget swig libltdl-dev \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libffi-dev libssl-dev build-essential

      - name: Upgrade Pip and Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.33 buildozer

      - name: Build with Buildozer
        run: |
          buildozer -v android release

      - name: Upload Compiled AAB
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.aab
